# Two-tier CI (Day 11), extended with a third tier (Day 20):
#   test           - always runs, every push and PR, no secrets needed. The
#                    PRIMARY gate: $0, pure pytest, nothing else depends on
#                    external services.
#   live-eval      - needs: test. Only runs on a push to `main` (not every
#                    PR -- a cost-bounded live OpenAI run shouldn't fire on
#                    every branch/draft). Exits 0 cleanly, with an
#                    explanation printed, if no OPENAI_API_KEY secret is
#                    configured -- see scripts/ci_eval.py.
#   publish-image  - needs: [test, live-eval]. Only on a push to `main`,
#                    and only once both quality gates above have passed (or
#                    skipped cleanly). Builds the Day 18 Dockerfile and
#                    pushes to GHCR -- no new secret required, since
#                    GITHUB_TOKEN already has packages:write for this repo.
#
# Add OPENAI_API_KEY as a repo secret (Settings -> Secrets and variables ->
# Actions) if you want the `live-eval` job to run for real on pushes to
# `main`; without it, `live-eval` (and therefore `publish-image`) still
# runs and still goes green, just without the live cost/quality check.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  live-eval:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/ci_eval.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  publish-image:
    needs: [test, live-eval]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
